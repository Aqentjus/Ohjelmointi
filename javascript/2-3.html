<!DOCTYPE html>
<html>
  <head>
    <title>Task 2-3</title>
  </head>
  <body>

    <h2>Dog Names</h2>
    <ul id="dogList"></ul>

<script>
    let dogs = [];

    for (let i = 0; i < 6; i++) {
        let name = prompt("Enter name of dog " + (i + 1) + ":");
        dogs.push(name);
    }

    dogs.sort((a, b) => b.localeCompare(a));

    const list = document.getElementById("dogList");

    for (let dog of dogs) {
        let li = document.createElement("li");
        li.textContent = dog;
        list.appendChild(li);
    }
    </script>

  </body>
</html>
