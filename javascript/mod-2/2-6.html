<!DOCTYPE html>
<html lang="en">

  </head>
  <body>
    <h3>Random rumber from function was:</h3>
    <p id="result"></p>
    <script>
    function random_dice_roll() {
      let min = 1;
      let max = 6;
      let random = parseInt(Math.random() * (max - min) + min);
      return random;
    };

    document.getElementById("result").textContent = random_dice_roll();

    </script>
  </body>
