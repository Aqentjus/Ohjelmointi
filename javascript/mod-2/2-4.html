<html>
  <head>
        <title>Number Sorting</title>
  </head>
  <body>

<script>
    let numbers = [];

    while (true) {
        let input = Number(prompt("Enter a number (0 to stop):"));

        if (input === 0) {
            break;
        }

        numbers.push(input);
    }

    numbers.sort((a, b) => b - a);

    console.log("Numbers from largest to smallest:");
    for (let num of numbers) {
        console.log(num);
    }
    </script>

  </body>
</html>
